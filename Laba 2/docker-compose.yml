services:
  postgres:
    image: postgres:15
    container_name: laba5-postgres
    environment:
      POSTGRES_DB: laba5_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"  # Изменяем порт на 5433 чтобы не конфликтовать с локальной БД
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Убираем healthcheck - он вызывает проблемы в Windows
    restart: unless-stopped

  app:
    build: .
    container_name: swc-laba2-app
    ports:
      - "8080:8080"
    environment:
      # Подключаемся к PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/laba5_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Отключаем валидацию при старте
      SPRING_DATASOURCE_VALIDATION_QUERY: "SELECT 1"
    # Ждем 30 секунд перед запуском
    command: >
      sh -c "
      echo 'Ждем 30 секунд для запуска PostgreSQL...' &&
      sleep 30 &&
      echo 'Запускаем приложение...' &&
      java -jar app.jar
      "
    restart: unless-stopped

volumes:
  postgres_data: